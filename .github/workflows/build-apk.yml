name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21" # Robolectric needs JDK 21 for SDK 36

      # The repo has no gradlew script, so install the version pinned in gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # debug.keystore is gitignored. Its SHA-1/SHA-256 are registered in Firebase (Google Sign-In,
      # phone auth), so CI must sign with the same key: restore it from the DEBUG_KEYSTORE_B64 secret.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_B64 not set; signing with a throwaway key, so Google Sign-In and phone OTP will not work in this APK"
            keytool -genkeypair -keystore debug.keystore -storepass android               -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048               -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Google Sign-In and phone OTP only work when the APK's signing fingerprint is registered in
      # Firebase. Print it, and say plainly whether it matches the SHA-1 in google-services.json.
      - name: Check signing fingerprint against Firebase
        run: |
          SHA1=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | awk '/SHA1:/ {print $2}')
          SHA256=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/ {print $2}')
          REGISTERED=$(grep -o '"certificate_hash": *"[0-9a-fA-F]*"' app/google-services.json | grep -o '[0-9a-fA-F]\{40\}' | tr 'a-f' 'A-F' || true)
          PLAIN=$(echo "$SHA1" | tr -d ':')
          {
            echo "### APK signing fingerprints"
            echo "- SHA-1: \`$SHA1\`"
            echo "- SHA-256: \`$SHA256\`"
            if echo "$REGISTERED" | grep -qx "$PLAIN"; then
              echo "- ✅ SHA-1 matches app/google-services.json: Google Sign-In and phone OTP can work"
            else
              echo "- ❌ SHA-1 is NOT in app/google-services.json: Google Sign-In and phone OTP will fail in this APK."
              echo "  Set the DEBUG_KEYSTORE_B64 secret to the keystore that is registered, or add both fingerprints above in"
              echo "  Firebase console → Project settings → Your apps → com.ojashealing.family, then download google-services.json again."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if ! echo "$REGISTERED" | grep -qx "$PLAIN"; then
            echo "::warning::APK signing SHA-1 $SHA1 is not registered in Firebase; Google Sign-In and phone OTP will fail in this APK"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ojas-family-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Firebase emulators run on the JVM
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install test dependencies
        run: |
          npm ci --prefix rules-test
          npm ci --prefix functions

      - name: Build functions
        run: npm run build --prefix functions

      - name: Security rules tests (emulator)
        run: npx -y firebase-tools@latest emulators:exec --only firestore,storage --project demo-ojas "npm test --prefix rules-test"

      - name: Cloud Functions tests (emulator)
        run: npx -y firebase-tools@latest emulators:exec --only firestore --project demo-ojas "npm test --prefix functions"
